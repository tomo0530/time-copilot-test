name: store_item

dataset:
  path: demand-forecasting-kernels-only
  train_file: train.csv
  test_file: test.csv

preprocessing:
  unique_id_format: "store_{store}_item_{item}"
  unique_id_column: unique_id
  date_column: date
  target_column: sales
  freq: D
  exclude_zero_sales: false

holdout:
  strategy: time_series_split
  train_end: null
  test_start: null
  test_end: null
  train_end_day: null
  test_start_day: null
  test_end_day: null

forecasting:
  horizon: 90

evaluation:
  metric: smape
  weight_days: null
  hierarchy_levels: null
