[project]
name = "project-module"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "kaggle>=1.8.3",
    "lightgbm>=4.0.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "prophet>=1.1.5",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-ai>=0.0.49",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.2.1",
    "statsforecast>=1.7.0",
    "timecopilot>=0.0.22",
    "torch>=2.0.0",
    "chronos-forecasting>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy~=1.15.0",
    "pytest~=8.4.1",
    "pytest-cov~=6.2.1",
    "pytest-mock~=3.12.0",
    "ruff~=0.11.2",
]
